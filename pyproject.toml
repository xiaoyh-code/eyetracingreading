[project]
name = "gaze-reader"
version = "0.1.0"
license = "GPL-3.0-or-later"
description = "A local, gaze-assisted English reader with Traditional Chinese explanations."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5,<7",
  "markdown-it-py>=3,<5",
  "python-docx>=1.1,<2",
  "python-dotenv>=1,<2",
  "openai>=1.68,<3",
  "ctranslate2>=4.5,<5",
  "sentencepiece>=0.2,<1",
  "opencc-python-reimplemented>=0.1.7,<1",
  "tencentcloud-sdk-python-hunyuan>=3.1,<4",
]

[project.scripts]
gaze-reader = "reader.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reader"]

[tool.hatch.build.targets.wheel.force-include]
"reader/static" = "reader/static"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
